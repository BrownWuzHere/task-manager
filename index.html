<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <h1>Task Manager</h1>
      <p></p>
      <div class="error-banner" id="error-banner"></div>
      <div class="controls">
        <button
          id="theme-toggle"
          class="theme-btn"
          aria-label="Toggle Dark Mode"
        >
          🌙
        </button>
        <input type="text" id="search-box" placeholder="Search tasks..." />
        <div class="input-group">
          <input type="text" id="add-box" placeholder="Add new task..." />
          <button onclick="addTask()">Add</button>
        </div>
        <div class="sort-buttons">
          <button onclick="sortTasks('asc')">A - Z</button>
          <button onclick="sortTasks('desc')">Z - A</button>
          <button onclick="checkTasks()">Check</button>
          <button onclick="getNextTask()">Next</button>
        </div>
      </div>
      <ul id="task-list"></ul>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
